# The one place for the product's name, ids, repository and version. Every script reads this file, and the build stamps
# the engine and the panel from it. Shell syntax, no spaces around =.
# REPO is where installed copies look for updates and where Report a Bug goes. scripts/stamp-panel.sh writes it into the
# panel at build time. To rehearse an update, point it at a throwaway repository in a separate clone: docs/RELEASING.md.
NAME=Select
BUNDLE_ID=com.skyfallstatus.select
ENGINE=select-engine
REPO=skyfallstatus/select
VERSION=0.2.0
MIN_MACOS=13.0
