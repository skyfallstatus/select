<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Select</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div id="toolbar">
      <button id="show" class="pick" aria-haspopup="menu" aria-expanded="false" title="What to show"><span class="k">Show</span><span class="v">Everything</span><i class="chev" data-icon="chevron"></i></button>
      <button id="sort" class="pick" aria-haspopup="menu" aria-expanded="false" title="How to sort"><span class="k">Sort</span><span class="v">As listed</span><i class="chev" data-icon="chevron"></i></button>
      <button id="flip" class="icon" hidden aria-label="Reverse the sort" data-icon="flip"></button>
      <div id="families" role="group" aria-label="Colour"></div>
      <span id="project-name" hidden></span>
      <label id="search-box" title="Name, folder, what's in the frames, words on screen, sounds, camera, lens, shot size, colour">
        <i class="glass" data-icon="search"></i>
        <input id="search" type="text" spellcheck="false" placeholder="Search" aria-label="Search clips" autocomplete="off">
        <span id="search-count" hidden></span>
        <button id="search-clear" hidden aria-label="Clear search" title="Clear search" data-icon="close"></button>
      </label>
      <button id="more" class="icon" aria-label="More" aria-haspopup="true" title="More" data-icon="more"></button>
    </div>
    <section id="foot" aria-live="polite" data-open="false">
      <div id="band-in">
        <div id="foot-top" class="row" hidden>
          <span id="foot-mark" data-kind="project" aria-hidden="true"></span>
          <p id="foot-words"><b id="foot-verdict"></b><span id="foot-sentence"></span></p>
          <div id="foot-actions">
            <button id="stop" class="action" hidden>Stop</button>
            <button id="foot-details" class="action" hidden>Details</button>
            <button id="undo-write" class="action" hidden>Undo</button>
            <button id="scan" class="action primary" hidden>Scan</button>
          </div>
        </div>
        <p id="status-note" hidden></p>
        <div id="update-line" class="row" role="status" aria-live="polite" hidden></div>
      </div>
    </section>
  </header>
  <div id="grid" tabindex="0">
    <div id="head"></div>
    <div id="body"></div>
    <div id="tiles" hidden></div>
    <div id="empty" hidden><span id="empty-words"></span><button id="empty-clear" class="action" hidden>Clear search</button></div>
  </div>
  <footer id="bottom" hidden>
    <div id="modes" role="group" aria-label="View">
      <button id="mode-list" class="icon" aria-label="List" title="List" data-icon="list"></button>
      <button id="mode-grid" class="icon" aria-label="Grid" title="Grid" data-icon="grid"></button>
    </div>
    <div id="count-box"><span id="count"></span></div>
    <div id="bottom-actions">
      <button id="do-sequence" class="action" disabled><span class="long">Make Sequence</span><span class="short">Sequence</span></button>
      <button id="do-bins" class="action primary" disabled><span class="long">Sort into Bins</span><span class="short">Bins</span></button>
    </div>
  </footer>
  <div id="picker" role="menu" hidden></div>
  <div id="suggest" role="listbox" aria-label="Suggestions" hidden></div>
  <div id="menu" role="menu" hidden>
    <div class="title" id="menu-title"></div>
    <button role="menuitem" data-menu="stop-scan" hidden>Stop Scan</button>
    <button role="menuitem" data-menu="rescan">Rescan</button>
    <button role="menuitem" data-menu="scan-whole">Scan Whole Project</button>
    <button role="menuitem" data-menu="scan-folder" title="Not tied to a project">Scan a Folder…</button>
    <hr data-mid>
    <button role="menuitem" data-menu="columns">Columns…</button>
    <button role="menuitem" data-menu="undo-view" hidden title="Back to the previous sort and filter. Changes nothing in the project.">Previous View</button>
    <button role="menuitem" data-menu="undo" hidden>Undo</button>
    <button role="menuitem" data-menu="clear">Clear Results</button>
    <hr>
    <button role="menuitem" data-menu="bug">Report a Bug</button>
    <button role="menuitem" data-menu="about">About Select</button>
    <hr data-update hidden>
    <button role="menuitem" data-update="check" hidden>Check for Updates</button>
    <button role="menuitemcheckbox" data-update="auto" aria-checked="true" hidden title="Once a day, asks GitHub whether there's a new version">Check Automatically</button>
  </div>
  <div id="modal" hidden>
    <div id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <div id="dialog-main">
        <h1 id="dialog-title"></h1>
        <div id="dialog-body"></div>
      </div>
      <div id="dialog-buttons">
        <button id="dialog-cancel" class="action">Cancel</button>
        <button id="dialog-ok" class="action primary">OK</button>
      </div>
    </div>
  </div>
</div>
<script src="core.js"></script>
<script src="native.js"></script>
<script src="app.js"></script>
<script src="update.js"></script>
</body>
</html>
