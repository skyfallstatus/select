<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Select</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div id="title">
      <h1 id="project-name"></h1>
      <span id="subtitle"></span>
    </div>
    <label id="search-box" title="Finds clips by name, what the frames show, words on screen, sounds, camera, lens, shot size and colour. Several words narrow it.">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="5" cy="5" r="3.9"/><path d="M8 8l3.1 3.1"/></svg>
      <input id="search" type="text" spellcheck="false" placeholder="Search: guitar, street, Sony" aria-label="Search clips" autocomplete="off">
      <span id="search-count" hidden></span>
      <button id="search-clear" hidden aria-label="Clear search" title="Clear search"><svg width="9" height="9" viewBox="0 0 9 9" aria-hidden="true"><path d="M1 1l7 7M8 1L1 8"/></svg></button>
    </label>
    <div id="source" role="group" aria-label="What to scan">
      <button class="word" data-src="selection" data-label="Selection" title="The clips or bins selected in the Project panel">Selection</button>
      <button class="word" data-src="project" data-label="Project" title="Every clip in the project">Project</button>
      <button class="word" data-src="folder" data-label="Folder" title="Video files in a folder on disk">Folder</button>
    </div>
    <button id="more" class="icon" aria-label="More" aria-haspopup="true" title="More">
      <svg width="13" height="3" viewBox="0 0 13 3" aria-hidden="true"><circle cx="1.5" cy="1.5" r="1.25"/><circle cx="6.5" cy="1.5" r="1.25"/><circle cx="11.5" cy="1.5" r="1.25"/></svg>
    </button>
  </header>
  <div id="folder-box" hidden>
    <input id="folder" type="text" spellcheck="false" placeholder="Folder to scan" aria-label="Folder to scan">
    <button id="choose" class="link">Choose</button>
  </div>
  <div id="bar">
    <button id="show" class="pick" aria-haspopup="menu" aria-expanded="false" title="What to show"><span class="k">Show</span><span class="v">Everything</span><svg class="chev" width="8" height="5" viewBox="0 0 8 5" aria-hidden="true"><path d="M1 1l3 3 3-3"/></svg></button>
    <button id="sort" class="pick" aria-haspopup="menu" aria-expanded="false" title="How to sort"><span class="k">Sort</span><span class="v">As listed</span><svg class="chev" width="8" height="5" viewBox="0 0 8 5" aria-hidden="true"><path d="M1 1l3 3 3-3"/></svg></button>
    <button id="flip" class="icon" hidden aria-label="Reverse the sort"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3.5 1.5v9M1 8l2.5 2.5L6 8M8.5 10.5v-9M6 4l2.5-2.5L11 4"/></svg></button>
    <div id="families" role="group" aria-label="Colour"></div>
    <div id="modes" role="group" aria-label="View">
      <button id="mode-list" class="icon" aria-label="List" title="List"><svg width="14" height="12" viewBox="0 0 14 12" aria-hidden="true"><rect x="0" y="1" width="14" height="1.6" rx=".8"/><rect x="0" y="5.2" width="14" height="1.6" rx=".8"/><rect x="0" y="9.4" width="14" height="1.6" rx=".8"/></svg></button>
      <button id="mode-grid" class="icon" aria-label="Grid" title="Grid"><svg width="14" height="12" viewBox="0 0 14 12" aria-hidden="true"><rect x="0" y="0" width="6" height="5" rx="1.2"/><rect x="8" y="0" width="6" height="5" rx="1.2"/><rect x="0" y="7" width="6" height="5" rx="1.2"/><rect x="8" y="7" width="6" height="5" rx="1.2"/></svg></button>
    </div>
  </div>
  <div id="grid" tabindex="0">
    <div id="head"></div>
    <div id="body"></div>
    <div id="tiles" hidden></div>
    <div id="empty" hidden><span id="empty-words"></span> <button id="empty-clear" class="link" hidden>Clear search</button></div>
  </div>
  <footer id="foot">
    <div id="foot-top">
      <span id="foot-mark" data-kind="waiting" aria-hidden="true">
        <svg class="m-ring" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6.3"/></svg>
        <svg class="m-arc" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6.3"/></svg>
        <svg class="m-disc" viewBox="0 0 14 14"><circle cx="7" cy="7" r="7"/><path d="M4.1 7.3l2 2 3.8-4.4"/></svg>
        <svg class="m-seal" viewBox="0 0 16 16"><path d="M8 .4l1.9 1.4 2.3-.3 1 2.1 2.1 1-.3 2.3L16.4 8 15 9.9l.3 2.3-2.1 1-1 2.1-2.3-.3L8 16.4l-1.9-1.4-2.3.3-1-2.1-2.1-1 .3-2.3L-.4 8 1 6.1.7 3.8l2.1-1 1-2.1 2.3.3z"/><path class="tick" d="M4.8 8.2l2.2 2.2 4.2-4.9"/></svg>
        <svg class="m-look" viewBox="0 0 14 14"><path d="M7 1.4l6.2 11H.8z"/><path class="stroke" d="M7 5.4v3.2M7 10.2v.5"/></svg>
        <svg class="m-skip" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6.3"/><path d="M4.2 7h5.6"/></svg>
        <svg class="m-fail" viewBox="0 0 14 14"><path d="M4.4.6h5.2l3.8 3.8v5.2l-3.8 3.8H4.4L.6 9.6V4.4z"/><path class="stroke" d="M4.8 4.8l4.4 4.4M9.2 4.8L4.8 9.2"/></svg>
      </span>
      <h2 id="foot-verdict"></h2>
      <div id="foot-actions">
        <button id="stop" class="action" hidden>Stop</button>
        <button id="foot-details" class="action" hidden>Details</button>
        <button id="do-label" class="action" hidden title="Set a colour label on the selected rows, or on the current view">Label</button>
        <button id="do-columns" class="action" hidden title="Writes what Select found into Project panel columns, so Premiere can sort by them">Add Columns</button>
        <button id="do-bins" class="action" hidden title="Moves these clips into new bins in the Project panel. Files on disk stay where they are.">Sort into Bins</button>
        <button id="undo-write" class="action" hidden>Undo</button>
        <button id="scan" class="action primary" hidden>Scan</button>
      </div>
    </div>
    <div id="foot-under">
      <div id="foot-meter" hidden role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100"><div id="foot-meter-fill"></div></div>
      <p id="foot-sentence"></p>
    </div>
    <p id="status-unread" hidden></p>
    <p id="status-note" hidden></p>
  </footer>
  <div id="picker" role="menu" hidden></div>
  <div id="menu" role="menu" hidden>
    <button role="menuitem" data-menu="rescan">Rescan</button>
    <button role="menuitem" data-menu="columns">Columns…</button>
    <button role="menuitem" data-menu="undo-view" hidden title="Back to the previous sort and filter. Changes nothing in the project.">Undo View</button>
    <button role="menuitem" data-menu="undo" hidden>Undo Last Write</button>
    <button role="menuitem" data-menu="clear">Clear Results</button>
    <hr>
    <button role="menuitem" data-menu="bug">Report a Bug</button>
    <button role="menuitem" data-menu="about">About Select</button>
  </div>
  <div id="modal" hidden>
    <div id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <div id="dialog-main">
        <h1 id="dialog-title"></h1>
        <div id="dialog-body"></div>
      </div>
      <div id="dialog-buttons">
        <button id="dialog-cancel" class="action">Cancel</button>
        <button id="dialog-ok" class="action primary">OK</button>
      </div>
    </div>
  </div>
</div>
<script src="core.js"></script>
<script src="native.js"></script>
<script src="app.js"></script>
</body>
</html>
